name: Build Dumper

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Game package name'
        required: true
        default: 'com.mobile.legends'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Zygisk module
      run: |
        chmod +x gradlew
        ./gradlew :module:assembleRelease

    - name: Extract arm64-v8a.so from module ZIP
      run: |
        MODULE_ZIP=$(find . -name "*.zip" -path "*/build/*" -o -name "*.zip" -path "*/out/*" | head -1)
        if [ -z "$MODULE_ZIP" ]; then
          MODULE_ZIP=$(find . -name "zygisk-*.zip" | head -1)
        fi
        echo "Module ZIP: $MODULE_ZIP"
        mkdir -p output
        unzip -o "$MODULE_ZIP" "zygisk/arm64-v8a.so" -d output/
        mv output/zygisk/arm64-v8a.so output/
        rm -rf output/zygisk
        ls -la output/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dumper-${{ github.event.inputs.package_name }}
        path: output/
