name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Game package name'
        required: true
        default: 'com.mobile.legends'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - name: Build Zygisk module with Gradle
      run: |
        chmod +x gradlew
        ./gradlew :module:assembleRelease

    - name: Cross-compile injector for ARM64
      run: |
        NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -type d | sort -V | tail -1)
        CLANG="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
        SYSROOT="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        echo "Clang: $CLANG"
        $CLANG --sysroot="$SYSROOT" -O2 -pie -o injector_arm64 injector/injector.c
        file injector_arm64
        ls -la injector_arm64

    - name: Extract arm64-v8a.so from module ZIP
      run: |
        echo "=== Finding module ZIP ==="
        MODULE_ZIP=$(find . -name "*.zip" -path "*/out/*" | head -1)
        if [ -z "$MODULE_ZIP" ]; then
          MODULE_ZIP=$(find . -name "*.zip" -path "*/build/*" | head -1)
        fi
        if [ -z "$MODULE_ZIP" ]; then
          MODULE_ZIP=$(find . -name "zygisk-*.zip" | head -1)
        fi
        echo "Module ZIP: $MODULE_ZIP"
        if [ -n "$MODULE_ZIP" ]; then
          unzip -l "$MODULE_ZIP"
          unzip -o "$MODULE_ZIP" "zygisk/arm64-v8a.so" -d extracted/
          ls -la extracted/zygisk/
        else
          echo "ERROR: No module ZIP found!"
          find . -name "*.zip" -not -path "./.git/*"
          exit 1
        fi

    - name: Collect artifacts
      run: |
        mkdir -p output
        cp extracted/zygisk/arm64-v8a.so output/
        cp injector_arm64 output/
        echo "=== Final output ==="
        ls -la output/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlbb-tools-${{ github.event.inputs.package_name }}
        path: output/
