name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Game package name'
        required: true
        default: 'com.mobile.legends'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - name: Build Zygisk module with Gradle
      run: |
        chmod +x gradlew
        ./gradlew :module:assembleRelease

    - name: Cross-compile injector for ARM64
      run: |
        NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -type d | sort -V | tail -1)
        CLANG="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
        SYSROOT="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        echo "Clang: $CLANG"
        $CLANG --sysroot="$SYSROOT" -O2 -pie -o injector_arm64 injector/injector.c
        file injector_arm64
        ls -la injector_arm64

    - name: Collect artifacts
      run: |
        mkdir -p output
        find . -name "*.zip" -path "*/build/*" -exec cp {} output/ \;
        find . -name "arm64-v8a.so" -path "*/build/*" -exec cp {} output/ \; 2>/dev/null || true
        find . -name "arm64-v8a.so" -path "*/release/*" -exec cp {} output/ \; 2>/dev/null || true
        if [ -f injector_arm64 ]; then
          cp injector_arm64 output/
          echo "Injector copied"
        else
          echo "ERROR: injector_arm64 not found!"
          exit 1
        fi
        ls -la output/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlbb-tools-${{ github.event.inputs.package_name }}
        path: output/
